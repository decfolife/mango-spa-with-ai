<crem-skeleton
  *ngIf="isLoading"
  type="card"
  [instances]="4"
></crem-skeleton>

<div *ngIf="!isLoading" class="ai-lease-form">

  <div class="ai-lease-form__header">
    <crem-page-header
      [pageTitle]="pageTitle"
      [tabTitle]="pageTitle"
      [showListOrMapViewButtons]="false"
      [showSettingsButton]="false"
      [customActions]="true"
    >
      <div actions class="ai-lease-form__actions">
        <crem-button
          type="secondary"
          [icon]="'faArrowLeft'"
          (click)="navigateBack()"
        >Back to List</crem-button>

        <ng-container *ngIf="!errorMessage">
          <ng-container *ngIf="!editMode">
            <crem-button
              type="primary"
              id="ai-form-edit-btn"
              (click)="toggleEditMode()"
            >Edit</crem-button>
          </ng-container>

          <ng-container *ngIf="editMode">
            <crem-button
              type="secondary"
              id="ai-form-cancel-btn"
              (click)="onCancel()"
            >Cancel</crem-button>
            <crem-button
              type="primary"
              id="ai-form-save-btn"
              (click)="onSave()"
            >Save</crem-button>
          </ng-container>
        </ng-container>
      </div>
    </crem-page-header>
  </div>

  <!-- Error state -->
  <div *ngIf="errorMessage" class="ai-lease-form__error">
    <crem-icon icon="faCircleExclamation"></crem-icon>
    <p>{{ errorMessage }}</p>
  </div>

  <!-- Form sections -->
  <div *ngIf="!errorMessage" class="ai-lease-form__sections" [formGroup]="form">
    <mango-ai-form-section
      *ngFor="let section of sections; let i = index"
      [section]="section"
      [formGroup]="getSectionFormGroup(section.key)"
      [editMode]="editMode"
      [isExpanded]="true"
    ></mango-ai-form-section>
  </div>

</div>
