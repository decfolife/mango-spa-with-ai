<div class="ai-form-section" [class.ai-form-section--collapsed]="!isExpanded">

  <div class="ai-form-section__header" (click)="toggleExpanded()">
    <span class="ai-form-section__title">{{ section.title }}</span>
    <button type="button" mat-icon-button class="ai-form-section__expand-btn">
      <mat-icon>{{ isExpanded ? 'expand_less' : 'expand_more' }}</mat-icon>
    </button>
  </div>

  <div class="ai-form-section__body" *ngIf="isExpanded" [formGroup]="formGroup">

    <!-- Fields List -->
    <div class="ai-form-section__fields">
      <div
        class="ai-form-section__field"
        *ngFor="let field of section.fields"
      >
        <!-- Label container: history icon + label text -->
        <div class="ai-form-section__field-label">
          <div class="ai-form-section__field-history">
            <crem-field-history
              [helpTextID]="'ai-helpText-' + field.key"
              [visible]="false"
              dateFormat="MM/dd/yyyy"
              [dataSource]="null"
              [displayIcon]="'infoHistoryIcon'"
              [showFieldName]="false"
            ></crem-field-history>
          </div>
          <crem-input-label
            class="df-formSection-fieldLabel"
            [label]="field.label"
          ></crem-input-label>
        </div>

        <!-- Field content -->
        <div class="ai-form-section__field-content">

          <!-- View mode -->
          <crem-input-label
            *ngIf="!editMode"
            [label]="formatDisplayValue(field)"
          ></crem-input-label>

          <!-- Edit mode: text / number / currency / percent -->
          <crem-input
            *ngIf="editMode && field.type !== 'boolean' && field.type !== 'date'"
            [inputType]="field.type === 'number' || field.type === 'currency' || field.type === 'percent' ? 'number' : 'text'"
            [formControlName]="field.key"
          ></crem-input>

          <!-- Edit mode: date -->
          <crem-date-picker
            *ngIf="editMode && field.type === 'date'"
            [formControlName]="field.key"
            dateFormat="MM/dd/yyyy"
            [useMaskBehavior]="false"
          ></crem-date-picker>

          <!-- Edit mode: boolean -->
          <mat-checkbox
            *ngIf="editMode && field.type === 'boolean'"
            [formControlName]="field.key"
            class="ai-form-section__field-checkbox"
          ></mat-checkbox>

          <!-- Citation -->
          <div *ngIf="field.citation" class="ai-form-section__citation">
            <crem-icon icon="faQuoteLeft" size="xs"></crem-icon>
            <span>{{ field.citation }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Rent Schedule Sub-table -->
    <ng-container *ngIf="rentSchedule">

      <div class="ai-form-section__subtable-header">Base Rent Schedule</div>
      <dx-data-grid
        class="ai-form-section__subtable"
        [dataSource]="rentSchedule.scheduleItems"
        [showBorders]="true"
        [showColumnLines]="false"
        [showRowLines]="true"
        [rowAlternationEnabled]="true"
        [wordWrapEnabled]="false"
      >
        <dxo-load-panel [enabled]="false"></dxo-load-panel>
        <dxo-paging [enabled]="false"></dxo-paging>
        <ng-container *ngFor="let col of rentScheduleColumns">
          <dxi-column
            [dataField]="col.dataField"
            [caption]="col.caption"
            [dataType]="col.dataType"
            [format]="col.format"
            [width]="col.width"
          ></dxi-column>
        </ng-container>
      </dx-data-grid>

      <ng-container *ngIf="hasAbatements()">
        <div class="ai-form-section__subtable-header">Rent Abatements</div>
        <dx-data-grid
          class="ai-form-section__subtable"
          [dataSource]="rentSchedule.abatementItems"
          [showBorders]="true"
          [showColumnLines]="false"
          [showRowLines]="true"
          [rowAlternationEnabled]="true"
        >
          <dxo-load-panel [enabled]="false"></dxo-load-panel>
          <dxo-paging [enabled]="false"></dxo-paging>
          <ng-container *ngFor="let col of abatementColumns">
            <dxi-column
              [dataField]="col.dataField"
              [caption]="col.caption"
              [dataType]="col.dataType"
              [format]="col.format"
              [width]="col.width"
            ></dxi-column>
          </ng-container>
        </dx-data-grid>
      </ng-container>

    </ng-container>

  </div>
</div>
